<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Garden House Boquete — Management System</title>
<style>
:root{--g:#2f6b3f;--g2:#e8f3ea;--bd:#d5ddd6;--tx:#1d2a21;--r:#b3261e;--y:#fff6d6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--tx);background:#f5f7f5;display:flex;min-height:100vh}
nav{width:200px;background:var(--g);color:#fff;padding:12px;flex-shrink:0}nav h1{font-size:14px;margin:0 0 12px;line-height:1.3}
nav button{display:block;width:100%;text-align:left;background:transparent;color:#fff;border:0;padding:10px;border-radius:6px;font-size:15px;cursor:pointer}
nav button.on,nav button:hover{background:rgba(255,255,255,.18)}
main{flex:1;padding:14px;min-width:0}
.warn{background:var(--y);border:1px solid #e5d27a;padding:6px 10px;border-radius:6px;font-size:12px;margin-bottom:8px}
.card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1.3fr 1fr}.g3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
@media(max-width:850px){body{flex-direction:column}nav{width:100%;display:flex;flex-wrap:wrap;gap:4px}nav h1{width:100%}nav button{width:auto}.g2{grid-template-columns:1fr}}
button.b,button.s{background:var(--g);color:#fff;border:0;border-radius:6px;padding:9px 14px;font-size:15px;cursor:pointer}
button.s{background:#fff;color:var(--g);border:1px solid var(--g);padding:6px 10px;font-size:13px}button.d{background:var(--r);color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
input,select{padding:8px;border:1px solid var(--bd);border-radius:6px;font-size:15px;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{background:var(--g2)}
td.n,th.n{text-align:right}.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.prods button{min-height:70px;background:var(--g2);border:1px solid var(--bd);border-radius:8px;font-size:14px;cursor:pointer}
.tot{font-size:22px;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.tag{background:var(--g2);padding:2px 8px;border-radius:10px;font-size:12px}.red{color:var(--r)}.ok{color:var(--g)}
.cal td{text-align:center;font-size:12px;min-width:46px}.cal .occ{background:#f6c9a8}.cal .res{background:#cfe3f7}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:10px}.kpi b{font-size:20px;display:block}
label{font-size:13px}h3{margin:0 0 8px}
.login{max-width:360px;margin:60px auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:12px}
.dg{background:#fff;border-radius:10px;padding:16px;max-width:430px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.dg h3{margin:0 0 8px}.dg p{white-space:pre-line;margin:6px 0 10px}.dg label.ch{display:block;border:1px solid var(--bd);border-radius:8px;padding:10px;margin:6px 0;cursor:pointer;font-size:15px}
.dg input[type=text],.dg input[type=password],.dg input[type=number]{width:100%}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1d2a21;color:#fff;padding:10px 16px;border-radius:8px;z-index:10000;max-width:90%;font-size:14px;white-space:pre-line;display:none}
</style>
</head>
<body>
<nav id="nav"></nav>
<main><div class="warn">Comprobantes <b>NO FISCALES</b>. Valida tasas y reglas con tu contador.</div><div id="sync" style="font-size:12px;margin:0 0 8px"></div><div id="bk"></div><div id="app"></div></main>
<script>
/* ================= Utilidades ================= */
const $=s=>document.querySelector(s);
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const M=x=>'$'+Number(x||0).toFixed(2);
const today=()=>new Date(Date.now()-5*3600e3).toISOString().slice(0,10);
const now=()=>new Date().toLocaleString('es-PA');
const uid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5).toUpperCase();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const addDays=(d,n)=>new Date(new Date(d+'T12:00:00').getTime()+n*864e5).toISOString().slice(0,10);
const KEY='gh_boquete_db_v2';
function seed(){return{
 taxes:[{id:'GRAV',name:'ITBMS general (comida preparada, empacados)',rate:7},{id:'ALCO',name:'ITBMS bebidas alcohólicas',rate:10},{id:'EXE',name:'Exento / no gravado',rate:0},{id:'ALOJ',name:'ITBMS hospedaje',rate:10}],
 products:[
  {id:'P001',code:'1001',name:'Café americano (DEMO)',cat:'Bebidas',price:3,cost:.6,stock:100,min:10,tax:'GRAV',ley6:true,active:true},
  {id:'P002',code:'1002',name:'Pastel (DEMO)',cat:'Postres',price:4,cost:1.5,stock:20,min:5,tax:'GRAV',ley6:true,active:true},
  {id:'P003',code:'1003',name:'Sándwich (DEMO)',cat:'Comidas',price:5.5,cost:2,stock:15,min:5,tax:'GRAV',ley6:true,active:true},
  {id:'P004',code:'7501',name:'Agua embotellada (DEMO)',cat:'Empacados',price:1.5,cost:.5,stock:48,min:12,tax:'GRAV',ley6:false,active:true}],
 rooms:[{id:'H1',name:'Habitación Jardín (DEMO)',cap:2,rate:45,estado:'disponible',seasons:[],active:true},{id:'H2',name:'Habitación Doble (DEMO)',cap:3,rate:60,estado:'disponible',seasons:[],active:true},{id:'H3',name:'Familiar (DEMO)',cap:5,rate:80,estado:'disponible',seasons:[],active:true}],
 ley6:{code:'jubi',rest:25,hotelWeek:50,hotelWeekend:30,weekDays:[1,2,3,4]},
 sales:[],returns:[],sessions:[],cur:null,res:[],audit:[],sec:null,users:[],suppliers:[],purchases:[],expenses:[],moves:[],loginFails:{}};}
let db=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('gh_boquete_db_v1')||'null')||seed();
function migrate(){const s=seed();for(const k in s)if(db[k]===undefined)db[k]=s[k];
 if(!db.taxes.find(t=>t.id==='ALCO'))db.taxes.push(s.taxes[1]);
 db.rooms.forEach(r=>{r.estado=r.estado||'disponible';r.seasons=r.seasons||[];if(r.active===undefined)r.active=true;});
 db.products.forEach(p=>{if(p.active===undefined)p.active=true;});}
migrate();
let _saveErr=false;
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(db));_saveErr=false;}catch(e){_saveErr=true;try{bkBanner();}catch(_){}}
 snap();
 syncMark();
}
function snap(){
 try{const n=Date.now(),last=+localStorage.getItem(KEY+'_snapts')||0;if(n-last<20*60e3)return;
  const a=JSON.parse(localStorage.getItem(KEY+'_snaps')||'[]');a.unshift({t:now(),d:JSON.stringify(db)});
  localStorage.setItem(KEY+'_snaps',JSON.stringify(a.slice(0,3)));localStorage.setItem(KEY+'_snapts',String(n));
 }catch(e){try{localStorage.removeItem(KEY+'_snaps');}catch(_){}}
}
const snaps=()=>{try{return JSON.parse(localStorage.getItem(KEY+'_snaps')||'[]');}catch(e){return[];}};
function downloadBackup(){try{dl('respaldo-garden-house-'+today()+'.json',JSON.stringify(db),'application/json');}catch(e){toast('El navegador bloqueó la descarga. Permite descargas y usa Configuración > Descargar respaldo.');return;}db.lastBackup=Date.now();save();bkBanner();toast('Respaldo descargado. Guárdalo en un lugar seguro (USB, correo o nube).');}
function bkBanner(){
 const el=$('#bk');if(!el)return;
 if(_saveErr){el.innerHTML='<div class="warn red"><b>Este navegador no está guardando los datos</b> (modo privado, almacenamiento lleno o archivo abierto sin permiso). Descarga un respaldo ahora y abre el sistema desde su dirección web en Chrome.</div> <button class="s" onclick="downloadBackup()">Descargar respaldo</button>';return;}
 if(!me||(!db.sales.length&&!db.res.length&&!db.purchases.length)){el.innerHTML='';return;}
 const hrs=db.lastBackup?(Date.now()-db.lastBackup)/36e5:1e9;
 el.innerHTML=hrs>24?`<div class="warn red">${db.lastBackup?'Tu último respaldo fue hace '+Math.floor(hrs)+' horas.':'Aún no has descargado ningún respaldo.'} <button class="s" onclick="downloadBackup()">Descargar respaldo ahora</button></div>`:'';
}
let me=null;const user=()=>me?me.name:'Sistema';
function log(op,detail){db.audit.push({t:now(),u:user(),op,detail});save();}
const tax=id=>db.taxes.find(t=>t.id===id)||{rate:0};
const prod=id=>db.products.find(p=>p.id===id);
const isAdm=()=>me&&['Propietario','Administrador'].includes(me.role);
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}

/* ================= Roles y sesión ================= */
const LABEL={dash:'Inicio',pos:'Punto de venta',caja:'Caja',hist:'Ventas',hostal:'Hostal',inv:'Inventario',compras:'Compras',gastos:'Gastos',rep:'Reportes',cfg:'Configuración',aud:'Auditoría'};
const ROLES={Propietario:['dash','pos','caja','hist','hostal','inv','compras','gastos','rep','cfg','aud'],
 Administrador:['dash','pos','caja','hist','hostal','inv','compras','gastos','rep','aud'],
 Recepción:['hostal'],Cajero:['pos','caja','hist'],Cafetería:['pos','hist','inv'],Almacén:['inv','compras'],Contabilidad:['dash','rep','gastos','hist','aud']};
let view='pos';
async function boot(){
 migrate();
 try{localStorage.setItem(KEY+'_probe','1');localStorage.removeItem(KEY+'_probe');}catch(e){_saveErr=true;}
 bkBanner();
 await syncInit();
 const sid=sessionStorage.getItem('gh_me');if(sid)me=db.users.find(u=>u.id===sid)||null;
 if(!db.users.length)return setupScreen();
 if(!me)return loginScreen();
 start();
}
function setupScreen(){$('#nav').innerHTML='';$('#app').innerHTML=`<div class="card login"><h3>Instalación: crear Propietario</h3><p><small>Este usuario tiene acceso total. Usa una contraseña de al menos 8 caracteres.</small></p>
 <div class="row"><input id="su" placeholder="Nombre" style="width:100%"></div><div class="row"><input id="sp" type="password" placeholder="Contraseña" style="width:100%"></div><button class="b" onclick="mkOwner()">Crear</button></div>`;}
async function mkOwner(){const n=$('#su').value.trim(),p=$('#sp').value;if(!n||p.length<8)return alert('Nombre y contraseña (mín. 8).');
 const salt=uid('S');db.users.push({id:uid('U'),name:n,role:'Propietario',salt,hash:await sha(salt+p),active:true});me=db.users[0];sessionStorage.setItem('gh_me',me.id);log('USUARIO_CREADO','Propietario '+n);boot();}
function loginScreen(){$('#nav').innerHTML='';$('#app').innerHTML=`<div class="card login"><h3>The Garden House Boquete</h3><div class="row"><select id="lu" style="width:100%">${db.users.filter(u=>u.active).map(u=>`<option value="${u.id}">${esc(u.name)} (${u.role})</option>`).join('')}</select></div>
 <div class="row"><input id="lp" type="password" placeholder="Contraseña" style="width:100%" onkeydown="if(event.key==='Enter')login()"></div><button class="b" onclick="login()">Entrar</button></div>`;}
async function login(){
 const u=db.users.find(x=>x.id===$('#lu').value),f=db.loginFails[u.id]||{n:0,until:0};
 if(f.until>Date.now())return alert('Cuenta bloqueada temporalmente por intentos fallidos. Intenta más tarde.');
 if(await sha(u.salt+$('#lp').value)===u.hash){db.loginFails[u.id]={n:0,until:0};me=u;sessionStorage.setItem('gh_me',u.id);log('LOGIN','ok');start();}
 else{f.n++;if(f.n>=5){f.until=Date.now()+5*60e3;f.n=0;}db.loginFails[u.id]=f;db.audit.push({t:now(),u:u.name,op:'LOGIN_FALLIDO',detail:''});save();alert('Contraseña incorrecta.');}
}
function logout(){log('LOGOUT','');me=null;sessionStorage.removeItem('gh_me');boot();}
function start(){if(window._draftRestored&&ROLES[me.role].includes('pos')){toast('Se recuperó la venta que estaba en curso.');window._draftRestored=false;}const a=ROLES[me.role];view=a[0]==='dash'&&!['Propietario','Administrador','Contabilidad'].includes(me.role)?a[1]:a[0];buildNav();render();}
function buildNav(){$('#nav').innerHTML=`<h1>THE GARDEN HOUSE BOQUETE<br>MANAGEMENT SYSTEM</h1>`+ROLES[me.role].map(k=>`<button class="${k===view?'on':''}" onclick="go('${k}')">${LABEL[k]}</button>`).join('')+`<button onclick="logout()">Salir (${esc(me.name)})</button>`;}
function go(k){view=k;ed=null;er=null;buildNav();render();}
const render=()=>{if(!me)return;({dash:vDash,pos:vPos,caja:vCaja,hist:vHist,hostal:vHostal,inv:vInv,compras:vCompras,gastos:vGastos,rep:vRep,cfg:vCfg,aud:vAud})[view]();bkBanner();SYNC.stale=false;setSync();};

/* ================= Diálogos dentro de la página (no dependen de prompt/alert/confirm del navegador) ================= */
let _tt;
function toast(m){const t=$('#toast')||(()=>{const d=document.createElement('div');d.id='toast';document.body.appendChild(d);return d;})();t.textContent=String(m);t.style.display='block';clearTimeout(_tt);_tt=setTimeout(()=>t.style.display='none',6500);}
window.alert=m=>toast(m);
function dlg({title='',msg='',kind='text',type='text',value='',choices=[],ok='Aceptar',cancel='Cancelar',noCancel=false}){
 return new Promise(res=>{
  const o=document.createElement('div');o.className='ov';
  const inp=kind==='text'?`<input id="dgi" type="${type}" value="${esc(value)}" autocomplete="off">`:'';
  const chs=kind==='choice'?choices.map((c,i)=>`<label class="ch"><input type="radio" name="dgc" value="${i}"> ${esc(c.l)}</label>`).join(''):'';
  o.innerHTML=`<div class="dg" role="dialog"><h3>${esc(title)}</h3><p>${esc(msg)}</p>${inp}${chs}<div class="row" style="justify-content:flex-end;margin-top:12px">${noCancel?'':`<button class="s" id="dgx">${esc(cancel)}</button>`}<button class="b" id="dgo">${esc(ok)}</button></div></div>`;
  document.body.appendChild(o);
  const close=v=>{o.remove();document.removeEventListener('keydown',kd,true);res(v);};
  const done=()=>{if(kind==='text')return close($('#dgi').value);if(kind==='choice'){const s=o.querySelector('input[name=dgc]:checked');if(!s){toast('Elige una opción.');return;}return close(choices[+s.value].v);}close(true);};
  const kd=e=>{if(e.key==='Escape'&&!noCancel){e.preventDefault();close(kind==='confirm'?false:null);}if(e.key==='Enter'&&kind!=='choice'){e.preventDefault();done();}};
  document.addEventListener('keydown',kd,true);
  o.querySelector('#dgo').onclick=done;const x=o.querySelector('#dgx');if(x)x.onclick=()=>close(kind==='confirm'?false:null);
  const f=o.querySelector('#dgi');if(f)setTimeout(()=>f.focus(),30);
 });
}
const askText=(msg,o={})=>dlg({kind:'text',msg,...o});
const askConfirm=(msg,o={})=>dlg({kind:'confirm',msg,title:o.title||'Confirmar',...o});
const askChoice=(msg,choices,o={})=>dlg({kind:'choice',msg,choices,...o});
const askInfo=(msg,o={})=>dlg({kind:'confirm',msg,noCancel:true,...o});
const L6DOCS=[{v:'Cédula',l:'Cédula (mujer ≥55 años / hombre ≥60)'},{v:'Carné jubilado/pensionado',l:'Carné de jubilado o pensionado'}];

/* ================= PIN de autorización (Nivel B) ================= */
async function authorize(action){
 if(!db.sec){
  const p=await askText('Crea el PIN de autorización del propietario (mínimo 6 caracteres). Es distinto de tu contraseña.',{type:'password',title:'Crear PIN de autorización'});
  if(!p||p.length<6){alert('PIN no creado.');return false;}
  const salt=uid('S'),rk=Math.random().toString(16).slice(2,10)+Math.random().toString(16).slice(2,10);
  db.sec={salt,hash:await sha(salt+p),rhash:await sha(salt+rk),fails:0,locked:false};save();
  await askInfo('Guarda esta clave de recuperación fuera de la computadora. Solo se muestra una vez:\n\n'+rk,{title:'Clave de recuperación'});log('SEC_PIN_CREADO','');
 }
 if(db.sec.locked){
  const rk=await askText('Autorizaciones BLOQUEADAS. Ingresa la clave de recuperación del propietario.',{type:'password',title:'Desbloqueo'});
  if(rk&&await sha(db.sec.salt+rk)===db.sec.rhash){db.sec.locked=false;db.sec.fails=0;save();log('SEC_DESBLOQUEO','recuperación');}
  else{log('SEC_RECUPERACION_FALLIDA','');alert('Recuperación incorrecta.');return false;}
 }
 const p=await askText('Esta operación modifica datos protegidos. Ingresa el PIN del propietario.',{type:'password',title:'Autorización requerida: '+action});
 if(p===null)return false;
 if(await sha(db.sec.salt+p)===db.sec.hash){db.sec.fails=0;save();log('AUTORIZACION_OK',action);return true;}
 db.sec.fails++;log('AUTORIZACION_FALLIDA','intento '+db.sec.fails+' — '+action);
 if(db.sec.fails>=3){db.sec.locked=true;log('SEC_BLOQUEO','3 intentos fallidos');alert('3 intentos fallidos: autorizaciones bloqueadas.');}
 else alert('PIN incorrecto. Intentos restantes: '+(3-db.sec.fails));
 save();return false;
}

/* ================= Inventario: recetas y movimientos ================= */
const unitCost=p=>p.recipe&&p.recipe.length?r2(p.recipe.reduce((a,i)=>a+((prod(i.pid)||{cost:0}).cost*i.qty),0)):p.cost;
const avail=p=>p.recipe&&p.recipe.length?Math.floor(Math.min(...p.recipe.map(i=>(prod(i.pid)||{stock:0}).stock/i.qty))+1e-9):p.stock;
function needs(p,q,map){if(p.recipe&&p.recipe.length)p.recipe.forEach(i=>needs(prod(i.pid),q*i.qty,map));else map[p.id]=(map[p.id]||0)+q;}
function move(p,q,type,ref,why){
 if(p.recipe&&p.recipe.length){p.recipe.forEach(i=>move(prod(i.pid),q*i.qty,type+' (receta '+p.name+')',ref,why));return;}
 p.stock=Math.round((p.stock+q)*1000)/1000;db.moves.push({t:now(),u:user(),pid:p.id,name:p.name,q:Math.round(q*1000)/1000,type,ref:ref||'',why:why||''});
}

/* ================= Cálculo de venta ================= */
function calcSale(cart,jubi,type){
 const L6=db.ley6;let sub=0,disc=0,tax_=0;
 const lines=cart.map(c=>{const p=prod(c.pid),gross=r2(p.price*c.qty);
  const ap=jubi&&c.benef&&p.ley6&&type!=='domicilio';
  const d=ap?r2(gross*L6.rest/100):0,base=r2(gross-d),rate=tax(p.tax).rate,t=r2(base*rate/100);
  sub+=gross;disc+=d;tax_+=t;
  return{pid:p.id,name:p.name,qty:c.qty,price:p.price,gross,disc:d,base,rate,tax:t,total:r2(base+t),cost:r2(unitCost(p)*c.qty),benef:!!ap};});
 return{lines,sub:r2(sub),disc:r2(disc),tax:r2(tax_),total:r2(sub-disc+tax_)};
}

/* ================= POS ================= */
let cart=[],jubi=null,otype='local',q='',pays=[{m:'Efectivo',amt:0,rec:0,ref:'',conf:true}];
try{const d=JSON.parse(localStorage.getItem(KEY+'_draft')||'null');if(d&&Array.isArray(d.cart)){const c=d.cart.filter(x=>prod(x.pid));if(c.length){cart=c;jubi=d.jubi||null;otype=d.otype||'local';if(d.pays&&d.pays.length)pays=d.pays;window._draftRestored=true;}}}catch(e){}
function vPos(){
 try{localStorage.setItem(KEY+'_draft',JSON.stringify({cart,jubi,otype,pays}));}catch(e){}
 const ps=db.products.filter(p=>p.active!==false&&(!q||(p.name+p.code).toLowerCase().includes(q.toLowerCase())));
 const c=calcSale(cart,!!jubi,otype);
 $('#app').innerHTML=`
 ${db.cur?'':'<div class="warn red">No hay caja abierta. Abre la caja en la sección Caja para poder cobrar.</div>'}
 <div class="grid g2"><div class="card">
  <div class="row"><input id="q" placeholder="Buscar por nombre o código (Enter agrega por código)" value="${esc(q)}" style="flex:1"></div>
  <div class="prods">${ps.map(p=>`<button onclick="addP('${p.id}')"><b>${esc(p.name)}</b><br>${M(p.price)}<br><small>Disp. ${avail(p)}</small></button>`).join('')||'Sin resultados'}</div>
 </div><div class="card">
  <div class="row"><label>Tipo:</label><select onchange="otype=this.value;render()">${['local','llevar','domicilio'].map(t=>`<option ${t===otype?'selected':''}>${t}</option>`).join('')}</select>
  <input id="code" placeholder="Código (jubi)" size="10" onkeydown="if(event.key==='Enter')applyCode()"><button class="s" onclick="applyCode()">Aplicar</button></div>
  ${jubi?`<div class="tag">Ley 6 jubilado: ${esc(jubi.doc)} — verificado por ${esc(jubi.by)} <a href="#" onclick="jubi=null;render();return false">quitar</a></div>`:''}
  ${ley6Warn(c)}
  ${jubi&&c.disc>0?`<div class="tag" style="background:#d6efdc">Descuento Ley 6 aplicado: -${M(c.disc)}</div>`:''}
  ${jubi&&otype==='domicilio'?'<div class="warn">El descuento de jubilados NO aplica a pedidos a domicilio.</div>':''}
  <table><tr><th>Producto</th><th class="n">Cant</th><th class="n">Importe</th>${jubi?'<th>Benef.</th>':''}<th></th></tr>
  ${c.lines.map((l,i)=>`<tr><td>${esc(l.name)}<br><small>${M(l.price)}${l.disc?` · desc ${M(l.disc)}`:''}</small></td>
   <td class="n"><input type="number" min="1" value="${l.qty}" style="width:60px" onchange="setQ(${i},this.value)"></td><td class="n">${M(l.gross)}</td>
   ${jubi?`<td><input type="checkbox" ${cart[i].benef?'checked':''} onchange="cart[${i}].benef=this.checked;render()"></td>`:''}

async function doDevol(id){

 const prev=db.returns.filter(r=>r.venta===id);let monto=0,base=0,cost=0;const lines=[];
 for(let i=0;i<s.lines.length;i++){const l=s.lines[i];const qn=parseInt($('#rq'+i).value)||0;const ya=prev.reduce((a,r)=>a+(r.lines.find(x=>x.pid===l.pid)?.qty||0),0);
  if(qn>l.qty-ya||qn<0)return alert('Cantidad inválida en '+l.name);

 if(!lines.length)return alert('Nada que devolver');
 if(!await authorize('Devolución '+id))return;
 lines.forEach(l=>move(prod(l.pid),l.qty,'Devolución',id,mot));
 db.returns.push({id:uid('D'),venta:id,t:now(),d:today(),user:user(),motivo:mot,metodo:$('#rmet').value,monto:r2(monto),base:r2(base),cost:r2(cost),lines,sesion:db.cur.id});

}

function nightsOf(r){const out=[];let d=r.in;while(d<r.out){out.push(d);d=addDays(d,1);}return out;}
function resCalc(r){
 const L=db.ley6,ns=nightsOf(r);let sub=0,disc=0;
 const rows=ns.map(n=>{const rate=(r.nightRates&&r.nightRates[n]!==undefined)?r.nightRates[n]:r.rate,dow=new Date(n+'T12:00:00').getDay(),pct=r.jubi?(L.weekDays.includes(dow)?L.hotelWeek:L.hotelWeekend):0,d=r2(rate*pct/100);sub+=rate;disc+=d;return{n,rate,pct,d};});
 const base=r2(sub-disc),tx=r2(base*tax('ALOJ').rate/100);
 const extras=r2((r.extras||[]).reduce((a,x)=>a+x.monto,0)),extrasTax=r2((r.extras||[]).reduce((a,x)=>a+r2(x.monto*tax(x.tax||'EXE').rate/100),0));
 const total=r2(base+tx+extras+extrasTax),paid=r2((r.pays||[]).reduce((a,p)=>a+p.monto,0));
 return{rows,sub:r2(sub),disc:r2(disc),base,tax:tx,extras,extrasTax,total,paid,balance:r2(total-paid)};
}

const inR=(d,a,b)=>!d||(d>=a&&d<=b);
function finance(a,b){
 const sales=db.sales.filter(s=>inR(s.d,a,b)),rets=db.returns.filter(r=>inR(r.d,a,b));
 const netCaf=r2(sales.reduce((x,s)=>x+s.lines.reduce((y,l)=>y+l.base,0),0)-rets.reduce((x,r)=>x+(r.base||0),0));
 const costCaf=r2(sales.reduce((x,s)=>x+s.lines.reduce((y,l)=>y+(l.cost||0),0),0)-rets.reduce((x,r)=>x+(r.cost||0),0));
 const hs=db.res.filter(r=>!DEAD.includes(r.status)&&r.status!=='consulta'&&inR(r.in,a,b)).map(r=>({r,c:resCalc(r)}));
 const incHos=r2(hs.reduce((x,h)=>x+h.c.base+h.c.extras,0));
 const ex=db.expenses.filter(e=>e.estado==='aprobado'&&inR(e.d,a,b));const exA=ar=>r2(ex.filter(e=>e.area===ar).reduce((x,e)=>x+e.monto,0));
 return{sales,rets,netCaf,costCaf,hs,incHos,exCaf:exA('Cafetería'),exHos:exA('Hostal'),exGen:exA('General'),l6:r2(sales.reduce((x,s)=>x+s.disc,0)+hs.reduce((x,h)=>x+h.c.disc,0))};
}

/* ---- fusión de cambios simultáneos (3 vías: base, local, remoto) ---- */
function mergeLists(b,l,r){
 b=b||[];
 const idMode=[...b,...l,...r].some(x=>x&&typeof x==='object'&&!Array.isArray(x)&&x.id!==undefined);
 if(!idMode){ // sin id (auditoría, movimientos, textos): suma lo nuevo de cada lado
  const out=r.slice(),rs=new Set(r.map(J)),bs=new Set(b.map(J));
  for(const x of l){const s=J(x);if(!bs.has(s)&&!rs.has(s)){out.push(x);rs.add(s);}}
  return out;
 }
 const bm=new Map(b.map(x=>[x.id,x])),rm=new Map(r.map(x=>[x.id,x])),lm=new Map(l.map(x=>[x.id,x]));
 const out=r.slice(),idx=new Map(out.map((x,i)=>[x.id,i]));
 for(const x of l){
  const bx=bm.get(x.id),rx=rm.get(x.id);
  if(!rx){if(!bx){idx.set(x.id,out.length);out.push(x);}continue;} // nuevo local; si el remoto lo borró, se respeta
  if(!bx)continue;                                    // ambos lo crearon distinto: gana el servidor
  if(J(x)===J(bx))continue;                           // local no lo tocó
  if(J(rx)===J(bx)){out[idx.get(x.id)]=x;continue;}   // solo cambió local
  out[idx.get(x.id)]=mergeRec(bx,x,rx);               // cambiaron ambos: campo por campo
 }
 for(const bx of b){if(!lm.has(bx.id)){const i=out.findIndex(x=>x.id===bx.id);if(i>=0&&J(out[i])===J(bx))out.splice(i,1);}} // borrados locales
 return out;
}
function mergeRec(b,l,r){
 b=b||{};const out={...r};
 for(const k of new Set([...Object.keys(l),...Object.keys(r),...Object.keys(b)])){
  const bv=b[k],lv=l[k],rv=r[k];
  if(J(lv)===J(bv))continue;
  if(J(rv)===J(bv)){if(lv===undefined)delete out[k];else out[k]=clone(lv);continue;}
  if(k==='stock'&&typeof lv==='number'&&typeof rv==='number'&&typeof bv==='number'){out[k]=Math.round((rv+(lv-bv))*1000)/1000;continue;} // suma los cambios de inventario de ambos
  if(Array.isArray(lv)&&Array.isArray(rv)){out[k]=mergeLists(Array.isArray(bv)?bv:[],lv,rv);continue;}
  if(bv===undefined)continue;                          // sin base: gana el servidor
  out[k]=clone(lv);
 }
 return out;
}
function merge3(base,local,remote){
 base=base||{};const out=clone(remote);
 for(const k of new Set([...Object.keys(local),...Object.keys(remote),...Object.keys(base)])){
  if(k==='loginFails')continue;
  const bv=base[k],lv=local[k],rv=remote[k];
  if(J(lv)===J(bv))continue;
  if(J(rv)===J(bv)){if(lv===undefined)delete out[k];else out[k]=clone(lv);continue;}
  if(Array.isArray(lv)&&Array.isArray(rv))out[k]=mergeLists(Array.isArray(bv)?bv:[],lv,rv);
  else if(lv&&rv&&typeof lv==='object'&&typeof rv==='object'&&!Array.isArray(lv)&&!Array.isArray(rv))out[k]=mergeRec(bv&&typeof bv==='object'?bv:{},lv,rv);
  else if(bv!==undefined)out[k]=clone(lv);
 }
 return out;
}
/* ---- aplicar datos del servidor ---- */
function typing(){const a=document.activeElement;return !!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))||!!document.querySelector('.ov');}
function applyRemote(rev,remote,{silent=false}={}){
 const lf=db.loginFails;
 db=merge3(SYNC.base,syncable(),remote);db.loginFails=lf||{};migrate();
 SYNC.rev=rev;SYNC.base=clone(remote);persistBase();lsSave();
 setDirty(J(syncable())!==J(remote));
 if(me){const u=db.users.find(x=>x.id===me.id);if(!u||!u.active){me=null;sessionStorage.removeItem('gh_me');toast('Tu usuario fue desactivado.');boot();return;}me=u;}
 if(!silent&&me){
  if(['dash','pos','hist','caja','rep','aud'].includes(view)&&!typing())render();
  else{SYNC.stale=true;setSync();}
  toast('Se actualizaron datos desde otro equipo.');
 }
}
/* ---- subir cambios ---- */
async function syncPush(){
 if(!SYNC.on||SYNC.busy||!SYNC.dirty)return;
 SYNC.busy=true;let again=false;
 try{
  for(let i=0;i<5;i++){
   const snap=J(syncable());
   const r=await api('PUT','','{"baseRev":'+SYNC.rev+',"db":'+snap+'}');
   if(r.status===200&&r.body&&typeof r.body.rev==='number'){
    SYNC.rev=r.body.rev;SYNC.base=JSON.parse(snap);persistBase();
    const changed=J(syncable())!==snap;setDirty(changed);again=changed;setSync(changed?'pending':'ok');break;
   }
   if(r.status===409&&r.body){applyRemote(r.body.rev,r.body.db||{},{silent:true});if(!SYNC.dirty){setSync('ok');break;}continue;}
   if(r.status===0){setSync('offline');break;}
   if(r.status===401){setSync('auth');break;}
   if(r.status===413){setSync('error');toast(r.body&&r.body.message||'Demasiado grande para guardar en el servidor. Descarga un respaldo.');break;}
   setSync('error');break;
  }
 }finally{SYNC.busy=false;}
 if(again)SYNC.t=setTimeout(syncPush,800);
}
function syncMark(){
 if(!SYNC.on)return;
 setDirty(true);setSync('pending');clearTimeout(SYNC.t);SYNC.t=setTimeout(syncPush,1200);
}
/* ---- leer cambios de otros equipos ---- */
async function syncPoll(){
 if(!SYNC.on||SYNC.busy)return;
 if(SYNC.dirty){await syncPush();return;}
 const r=await api('GET','?rev='+SYNC.rev);
 if(r.status===0){setSync('offline');return;}
 if(r.status===401){setSync('auth');return;}
 if(r.status!==200||!r.body)return;
 if(r.body.same){if(SYNC.status!=='ok'&&SYNC.status!=='pending')setSync('ok');return;}
 if(r.body.db){applyRemote(r.body.rev,r.body.db);setSync('ok');}
}
async function syncChangeKey(){
 const k=await askText('Escribe la clave de acceso del sistema.',{type:'password',title:'Clave de acceso'});
 if(!k)return;SYNC.key=k;localStorage.setItem('gh_access_key',k);
 const r=await api('GET','?rev='+SYNC.rev);if(r.status===401){toast('Clave incorrecta.');return;}setSync('ok');syncPoll();syncPush();
}
const hasData=()=>db.users&&db.users.length>0;
async function syncInit(){
 if(SYNC.inited)return;SYNC.inited=true;
 if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1'){setSync('local');return;}
 let key=localStorage.getItem('gh_access_key')||'';
 const stored=localStorage.getItem(KEY+'_rev');
 for(let tries=0;tries<4;tries++){
  const probe=await api('GET','?rev='+(+stored||0),null,key||'x');
  if(probe.status===0){ // sin conexión: seguir con lo guardado en este equipo
   if(key&&stored!==null){SYNC.on=true;SYNC.key=key;SYNC.rev=+stored;try{SYNC.base=JSON.parse(localStorage.getItem(KEY+'_base')||'null');}catch(e){SYNC.base=null;}SYNC.dirty=localStorage.getItem(KEY+'_dirty')==='1';startSync();setSync('offline');}
   else setSync('local');
   return;
  }
  if(probe.status===404||(probe.status===200&&(!probe.body||typeof probe.body.rev!=='number'))){setSync('local');return;} // no hay función /api
  if(probe.status===500){toast(probe.body&&probe.body.message||'El servidor no está configurado.');await askInfo((probe.body&&probe.body.message)||'El servidor no está configurado.',{title:'Configuración pendiente en Netlify'});setSync('local');return;}
  if(probe.status===401||!key){
   if(key)toast('Clave incorrecta.');
   key=await askText('Escribe la clave de acceso del sistema (la que definiste en Netlify).',{type:'password',title:'Clave de acceso'});
   if(!key){setSync('local');return;}
   continue;
  }
  if(probe.status===200){
   localStorage.setItem('gh_access_key',key);SYNC.on=true;SYNC.key=key;
   await firstSync(probe.body,stored);startSync();return;
  }
  setSync('error');return;
 }
 setSync('auth');
}
async function firstSync(s,stored){
 const localHas=hasData();
 if(s.same&&!localHas){const r2=await api('GET','?rev=0');if(r2.status===200&&r2.body)s=r2.body;}
 if(s.rev===0){ // servidor vacío
  SYNC.rev=0;SYNC.base=null;
  if(localHas){setDirty(true);await syncPush();}else setSync('ok');
  return;
 }
 if(!localHas){ // equipo nuevo: adoptar datos del servidor
  db=clone(s.db);db.loginFails={};migrate();SYNC.rev=s.rev;SYNC.base=clone(s.db);persistBase();lsSave();setDirty(false);setSync('ok');return;
 }
 if(stored!==null){ // equipo que ya sincronizaba antes
  SYNC.rev=+stored;try{SYNC.base=JSON.parse(localStorage.getItem(KEY+'_base')||'null');}catch(e){SYNC.base=null;}
  SYNC.dirty=localStorage.getItem(KEY+'_dirty')==='1';
  if(s.same){setSync(SYNC.dirty?'pending':'ok');if(SYNC.dirty)syncPush();return;}
  applyRemote(s.rev,s.db,{silent:true});setSync('ok');if(SYNC.dirty)syncPush();return;
 }
 // este equipo tiene datos propios sin sincronizar y el servidor ya tiene otros
 const c=await askChoice('Este equipo tiene datos guardados antes de conectarse al servidor, y el servidor ya tiene otros datos. ¿Cuáles usar?',[
  {v:'server',l:'Usar los datos del servidor (recomendado). Los de este equipo se descargan como respaldo.'},
  {v:'local',l:'Subir los datos de este equipo y reemplazar los del servidor (el servidor guarda copia de lo anterior).'}],{title:'Primera conexión',ok:'Continuar',noCancel:true});
 if(c==='local'){SYNC.rev=s.rev;SYNC.base=clone(s.db);setDirty(true);db.loginFails=db.loginFails||{};
  // reemplazo explícito: se envía el estado local sobre la revisión actual
  const snap=J(syncable()),r=await api('PUT','','{"baseRev":'+s.rev+',"db":'+snap+'}');
  if(r.status===200){SYNC.rev=r.body.rev;SYNC.base=JSON.parse(snap);persistBase();setDirty(false);setSync('ok');return;}
  toast('No se pudo subir. Se usarán los datos del servidor.');
 }
 try{dl('respaldo-de-este-equipo-'+today()+'.json',JSON.stringify(db),'application/json');}catch(e){}
 db=clone(s.db);db.loginFails={};migrate();SYNC.rev=s.rev;SYNC.base=clone(s.db);persistBase();lsSave();setDirty(false);setSync('ok');
}
function startSync(){
 setInterval(syncPoll,20000);
 window.addEventListener('online',()=>{syncPush();syncPoll();});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncPoll();else syncPush();});
}
/* copias del servidor (historial diario) */
async function serverDays(){const r=await api('GET','?list');return r.status===200&&r.body?r.body.days:[];}
async function restoreServerDay(d){
 if(!await askConfirm('Se reemplazarán los datos actuales por la copia del servidor del '+d+'. Lo actual queda guardado en el historial.',{title:'Restaurar copia del servidor',ok:'Restaurar'}))return;
 const r=await api('GET','?daily='+d);if(r.status!==200||!r.body||!r.body.db)return toast('No se pudo leer esa copia.');
 db=r.body.db;db.loginFails={};migrate();log('RESTAURACION','copia del servidor '+d);save();toast('Copia restaurada y guardada. Inicia sesión de nuevo.');me=null;sessionStorage.removeItem('gh_me');boot();
}

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
boot();
